<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Explorer</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Product Explorer</h1>

    <section>
        <input
            id="search"
            type="text"
            placeholder="Search product..."
        >

        <select id="category">
            <option value="all">
                All Categories
            </option>
        </select>

        <select id="sort">
            <option value="default">
                Sort By
            </option>

            <option value="price-asc">
                Price: Low → High
            </option>

            <option value="price-desc">
                Price: High → Low
            </option>

            <option value="rating">
                Rating
            </option>

            <option value="title">
                Title
            </option>
        </select>
    </section>


    <section id="statistics">
        Loading statistics...
    </section>


    <section id="product-list">
        Loading products...
    </section>


    <script
        type="module"
        src="main.js">
    </script>

</body>

</html>
